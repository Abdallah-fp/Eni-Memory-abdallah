    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main>

              <h1>ENI-<strong>MEMORY</strong>-Accueil</h1>
        <div class="navbar">
                <a href="accueil.html">Accueil</a></li>
                <a href="inscrire.html">S'inscrire</a>
                <a href="seconnecter.html">Se connecter</a>
                <a href="Profil.html">Profil</a>
                <a href="Jouer.html">Jouer</a>
        </div>
        <br>
        <section class="connecter">
            <fieldset class="field_connecter">
                <h2 class="connection_h2">Connectez-vous</h2>
                <form>
                                <div>
                                    <label for="email">Entrez votre email</label><br>
                                    <input type="email" name="email" id="email" placeholder="votre email" required autofocus title="Renseigner votre email">
                                </div>
                                <div>
                                    <label for="mdp">Mot de passe</label><br>
                                    <input type="password" name="mdp" id="mdp" required placeholder="Votre mot de passe" title="Renseigner un mot de passe (min. 8 caractères dont au moins 1 minuscule , 1 majuscule et un chiffre)" 
                                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}">
                                </div>
                                <div>
                                    <input class="btn" type="submit" value="Se connecter">
                                    <input  class="btn" type="reset" value="Annuler">
                                </div>

                </form>
            </fieldset>
        </section>



    </main>

    
</body>
</html>
