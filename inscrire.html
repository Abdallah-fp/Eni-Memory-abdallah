        <section class="inscrire" >
            <!-- <h4><Inscrivez-vous class="Inscrivez-vous">Inscrivez-vous</Inscrivez-vous></h4> -->
                    <fieldset>
                                        <h2 class="inscription_h2">Inscrivez-vous.</h2>

                        <form>
                                <div>
                                    <label for="nom">Nom d'utilisateur</label> <br>
                                    <input type="text" name="nom" id="nom" placeholder="3 caractères minimum" required autofocus title="Renseigner votre nom" pattern="[a-zA-Z]+">
                                </div>
                                <div>
                                    <label for="email">Entrez votre email</label><br>
                                    <input type="email" name="email" id="email" placeholder="votre email" required autofocus title="Renseigner votre email">
                                </div>
                                <div>
                                    <label for="mdp">Mot de passe</label><br>
                                    <input type="password" name="mdp" id="mdp" required placeholder="Votre mot de passe" title="Renseigner un mot de passe (min. 8 caractères dont au moins 1 minuscule , 1 majuscule et un chiffre)" 
                                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}">
                                </div>
                                <div>
                                    <label for="Confirmez">Confirmez votre mot de passe</label><br>
                                    <input type="password" name="Confirmez" id="Confirmez" required placeholder="confirmez votre mot de passe" title="Renseigner un mot de passe (min. 8 caractères dont au moins 1 minuscule , 1 majuscule et un chiffre)" 
                                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}">
                                </div>
                                <div>
                                    <input class="btn" type="submit" value="création du compte">
                                    <input  class="btn" type="reset" value="Annuler">
                                </div>
                        </form>
                    </fieldset>
        </section>











    </main>
    
</body>
